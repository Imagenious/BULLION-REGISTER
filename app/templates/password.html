{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Change password · Bullion Register{% endblock %}
{% block content %}
<div class="auth" style="margin-top:2vh">
  <form class="box" method="post">
    {{ csrf() }}
    <h1>Change password</h1>
    {% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}
    <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="password">New password (8+ characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></div>
    <div class="field"><label for="confirm">Repeat new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8"></div>
    <button class="btn primary" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
