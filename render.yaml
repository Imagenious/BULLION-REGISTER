# Render Blueprint: New > Blueprint > pick this repo. Render asks for ADMIN_USERNAME and ADMIN_PASSWORD.
services:
  - type: web
    name: bullion-register
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bullion-db
          property: connectionString

databases:
  - name: bullion-db
    plan: free
    databaseName: bullion
